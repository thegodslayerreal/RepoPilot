name: RepoPilot issue suggestions
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: read
jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Print suggestions only
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -c "import os; from repopilot.triage import suggest_labels; print(suggest_labels(os.getenv('ISSUE_TITLE',''), os.getenv('ISSUE_BODY','')))"
