name: RepoPilot issue suggestions

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install RepoPilot
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Print suggestions only
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -c "import os; from repopilot.triage import suggest_labels; print(suggest_labels(os.getenv('ISSUE_TITLE', ''), os.getenv('ISSUE_BODY', '')))"
